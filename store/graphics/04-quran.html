<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(120% 70% at 50% 0%,#0d3b36 0%,#002828 45%,#011815 100%);font-family:"Anek Bangla",sans-serif;position:relative}
.pat{position:absolute;inset:0;background:url(pattern.svg);background-size:220px;opacity:.07}
.cap{position:absolute;top:120px;left:60px;right:60px;text-align:center}

p{margin:22px 0 0;color:#F3EED5;font-size:44px;font-weight:500;opacity:.92}
.ph{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);width:800px;border-radius:64px;padding:14px;background:#0b1513;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 2px rgba(255,201,64,.35)}
.ph img{display:block;width:100%;border-radius:52px}

<div class="cap"><h1>পুরো কুরআন</h1><p>অর্থ, শব্দে শব্দে ও তিলাওয়াতসহ</p></div>
<div class="ph"><img src="../crop/04-quran.png"></div></body></html>
