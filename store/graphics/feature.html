<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700&family=Grenze+Gotisch:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:linear-gradient(120deg,#002828 0%,#0d3b36 55%,#011815 100%);font-family:"Anek Bangla",sans-serif;position:relative}
.pat{position:absolute;inset:0;background:url(pattern.svg);background-size:160px;opacity:.08}

.brand span{font-family:"Grenze Gotisch",serif;font-weight:800;font-size:76px;color:#FFC940;line-height:1}

.ph{position:absolute;bottom:-150px;width:230px;border-radius:30px;padding:7px;background:#0b1513;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1.5px rgba(255,201,64,.35)}

<div class="ph a"><img src="../crop/01-home.png"></div><div class="ph b"><img src="../crop/03-tasbih.png"></div>
