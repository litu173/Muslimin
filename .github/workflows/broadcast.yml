# Sends one notification to every app user (app-update news). Run by hand:
# Actions → "Broadcast to all users" → Run workflow. Mode "dry-run" only
# counts the phones; "send" pushes and saves it for the app's Notifications
# page; "record" only saves it. Tapping it opens About the App (latest APK
# download). Needs the FIREBASE_SERVICE_ACCOUNT secret.
name: Broadcast to all users
on:
  workflow_dispatch:
    inputs:
      title:
        description: Notification title
        required: true
      body:
        description: Notification text
        required: true
      mode:
        description: dry-run (count phones only), send (push + save), record (save only)
        type: choice
        options: [dry-run, send, record]
        default: dry-run
jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.repository == 'litu173/Muslimin' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: firebase/tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/tools/package-lock.json
      - run: npm ci --omit=dev
        working-directory: firebase/tools
      - run: node broadcast.mjs ${{ inputs.mode == 'send' && '--send' || inputs.mode == 'record' && '--record' || '' }}
        working-directory: firebase/tools
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
